{% set name = "python-ipware" %}
{% set version = "4.1.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: a2cb7dc0869713256b8c3edda7923490ecc8fc160cb911563c16ec7631dd572b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=42
    - wheel
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - python_ipware
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: A Python package to retrieve users IP address
  dev_url: https://github.com/un33k/python-ipware
  home: https://pypi.org/project/python-ipware/
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - swainn
